[project]
name = "scouting-platform"
version = "0.1.0"
description = "Football data platform: player scouting search and league simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_platform", "features", "scouting", "simulation", "api"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import ordering
    "B",       # bugbear: common bugs (mutable default arguments, etc.)
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplifications
    "RUF",     # ruff-specific rules
]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
